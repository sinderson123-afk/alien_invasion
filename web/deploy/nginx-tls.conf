server {
    listen 80;
    server_name logan-ai.org;
    return 308 https://logan-ai.org$request_uri;
}

server {
    listen 443 ssl;
    server_name logan-ai.org;
    ssl_certificate /etc/nginx/alien-tls/origin.pem;
    ssl_certificate_key /etc/nginx/alien-tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/alien-cloudflare-realip.conf;
    client_max_body_size 1m;
    add_header X-Alien-Backend la-vps always;
    location / {
        if (-f /etc/nginx/alien-maintenance) { return 503; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
